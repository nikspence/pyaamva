[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyaamva"
version = "0.1.0"
description = "Parse AAMVA PDF417 driver's license and ID payloads"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["pyaamva*"]
